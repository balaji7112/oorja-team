server:
  port: 8080

spring:
  application:
    name: oorja-sync-backend
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/oorjasync}
    username: ${DATABASE_USERNAME:oorjasync}
    password: ${DATABASE_PASSWORD:oorjasync123}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  scheduling:
    enabled: true

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8001}

jwt:
  secret: ${JWT_SECRET:oorjasync-secret-key-change-in-production-2026}
  expiration: 86400000

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
